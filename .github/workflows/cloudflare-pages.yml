name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler outside repository workspace
        run: npm install --global wrangler@4

      - name: Ensure Pages project exists
        run: |
          wrangler pages project create reforma-tributaria-simulator --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy visual site to production
        run: wrangler pages deploy "$GITHUB_WORKSPACE/docs" --project-name=reforma-tributaria-simulator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 https://reforma-tributaria-simulator.pages.dev/ >/tmp/pages.html; then
              grep -q "PORTAL SIMULADOR FACILITADOR" /tmp/pages.html
              echo "Production site is reachable."
              exit 0
            fi
            echo "Production endpoint not ready yet; waiting 10s..."
            sleep 10
          done
          echo "Production endpoint did not become reachable during verification."
          exit 1
