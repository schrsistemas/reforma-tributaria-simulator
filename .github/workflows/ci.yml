name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test
      - run: pnpm test:site
      - run: pnpm typecheck
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed files for obvious credential assignments
        shell: bash
        run: |
          if git grep -nE 'CLOUDFLARE_(API_TOKEN|ACCOUNT_ID)[[:space:]]*=[[:space:]]*[^$][^[:space:]]{3,}' -- ':!.env.example' ':!docs/security/secrets.md' ':!.github/workflows/ci.yml'; then
            echo "Possible credential committed"
            exit 1
          fi
