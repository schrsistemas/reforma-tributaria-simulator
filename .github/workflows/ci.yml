name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed files for obvious credential assignments
        shell: bash
        run: |
          if git grep -nE 'CLOUDFLARE_API_TOKEN=.{4,}|CLOUDFLARE_ACCOUNT_ID=.{4,}' -- ':!docs/security/secrets.md' ':!.env.example'; then
            echo "Possible credential committed"
            exit 1
          fi
