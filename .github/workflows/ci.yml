name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Run unit and integration tests
        run: pnpm test
      - name: Validate static production site
        run: pnpm test:site
      - name: Type-check all workspaces
        run: pnpm typecheck
      - name: Build all workspaces
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed files for obvious credential assignments
        shell: bash
        run: |
          if git grep -nE 'CLOUDFLARE_(API_TOKEN|ACCOUNT_ID)[[:space:]]*=[[:space:]]*[^$][^[:space:]]{3,}' -- ':!.env.example' ':!docs/security/secrets.md' ':!.github/workflows/ci.yml'; then
            echo "Possible credential committed"
            exit 1
          fi
