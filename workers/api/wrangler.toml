name = "reforma-tributaria-simulator-api"
main = "src/index.ts"
compatibility_date = "2026-09-19"

[vars]
VERSION = "0.4.0"

[triggers]
crons = ["0 3 * * *"]

# Configure official calculator HTTPS endpoints as Worker vars (no default pilot URL):
