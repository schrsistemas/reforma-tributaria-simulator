# binding = "DB"
# database_name = "reforma-tributaria-simulator"
# database_id = "<D1_DATABASE_ID>"
# migrations_dir = "../../migrations"
#
# [[r2_buckets]]
# binding = "EVIDENCE_BUCKET"
# bucket_name = "reforma-tributaria-evidence"
