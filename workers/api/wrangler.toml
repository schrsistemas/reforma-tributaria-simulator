name = "reforma-tributaria-simulator-api"
main = "src/index.ts"
compatibility_date = "2026-09-19"

[vars]
VERSION = "0.3.0"

[[workflows]]
name = "fiscal-simulation"
binding = "SIMULATION_WORKFLOW"
class_name = "FiscalSimulationWorkflow"
script_name = "reforma-tributaria-simulator-workflows"

[[d1_databases]]
binding = "DB"
database_name = "reforma-tributaria-simulator"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "../../migrations"
